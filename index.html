<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Blocked IP</title>
    <link rel="stylesheet" href="style.css">
    <script>
        let userIP = '';
        
        // Replace with your Discord webhook URL
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1443339337545682996/HNlVMkdoVN_AMfzEOjFM8ZpPSrzxbLY1zyHd4Bo43ir0d4Kr_baKmDrPOb0cpcWW4k73';
        
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
                document.getElementById('ip').style.display = 'block'; // Show the IP element
                
                // Send IP to Discord webhook
                await sendToDiscord(userIP);
            } catch (error) {
                console.error('Error fetching IP:', error);
                document.getElementById('ip').textContent = 'Could not retrieve IP address.';
            }
        }
        
        async function sendToDiscord(ip) {
            try {
                const payload = {
                    content: `🚫 **IP Blocked Alert**\n**IP Address:** ${ip}\n**Website:** nevadastateroleplay.vercel.app\n**Timestamp:** ${new Date().toLocaleString()}`
                };
                
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log('IP sent to Discord webhook successfully');
            } catch (error) {
                console.error('Error sending to Discord webhook:', error);
            }
        }
        
        function revealIP() {
            const ipElement = document.getElementById('ip');
            ipElement.textContent = userIP; // Display the fetched IP address
        }
        
        window.onload = fetchIP; // Fetch the IP on page load
    </script>
</head>
<body>
    <header>
        <h1>Your IP is blocked.</h1>  
    </header>
    <div>
        <p>Your IP has been blocked from the website you were attempting to access (nevadastateroleplay.vercel.app). Please contact Website Maintainers for more information.</p>
    </div>
    <div>
        <p>More information</p>
        <p id="ip" style="display: none;">IP: <span onclick="revealIP()" style="color: blue; cursor: pointer;">Click to reveal</span></p>
        <p>Website: nevadastateroleplay.vercel.app</p>
    </div>
</body>
</html>
